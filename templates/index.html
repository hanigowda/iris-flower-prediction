<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Species Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🌸 Iris Species Predictor</h1>

        <p>Enter the flower measurements</p>

        <form action="/predict" method="POST">

            <label>Sepal Length (cm)</label>

            <input
                type="number"
                step="any"
                name="sepal_length"
                placeholder="Example: 5.1"
                required
            >


            <label>Sepal Width (cm)</label>

            <input
                type="number"
                step="any"
                name="sepal_width"
                placeholder="Example: 3.5"
                required
            >


            <label>Petal Length (cm)</label>

            <input
                type="number"
                step="any"
                name="petal_length"
                placeholder="Example: 1.4"
                required
            >


            <label>Petal Width (cm)</label>

            <input
                type="number"
                step="any"
                name="petal_width"
                placeholder="Example: 0.2"
                required
            >


            <button type="submit">
                Predict Species
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>Predicted Species</h2>

            <h3>{{ prediction }}</h3>

        </div>

        {% endif %}

    </div>

</body>

</html>
